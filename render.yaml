# Blueprint do Render pra API do MilLead (free tier).
# Como usar: Render dashboard -> New -> Blueprint -> selecionar este repo.
# O plano free "dorme" após ~15min ocioso e acorda no primeiro request
# (uns segundos de espera) -- aceitável pra uso interno.
services:
  - type: web
    name: millead-api
    runtime: node
    plan: free
    region: virginia # mais perto de sa-east-1 (Supabase/Upstash)
    # O Render já provê o pnpm (via packageManager do package.json) -- não
    # usar corepack aqui: /usr/bin é read-only e `corepack enable` quebra.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @millead/database exec prisma generate
    startCommand: pnpm --filter @millead/api exec tsx src/main/server.ts
    healthCheckPath: /health
    envVars:
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0" # corepack sem prompt interativo no build
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000" # porta padrão que o Render expõe
      - key: START_WORKERS
        value: "true" # workers BullMQ no mesmo processo (1 serviço só)
      - key: DATABASE_URL
        sync: false # cole a connection string do Supabase (session pooler)
      - key: JWT_ACCESS_SECRET
        generateValue: true # o Render gera um segredo forte
      - key: CORS_ORIGIN
        value: https://millead.milweb.com.br,https://millead.vercel.app
      - key: APP_PUBLIC_URL
        sync: false # https://millead-api.onrender.com (a URL deste serviço)
      # MilSocial (métricas do Instagram). Declaradas aqui porque ficarem só na
      # doc já custou caro: o sync diário passou dias quebrado por causa de uma
      # delas. `sync: false` = o valor é colado no dashboard, não no blueprint.
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false # token long-lived do Instagram (ver docs/milsocial-setup.md, seção 2)
      - key: MILSOCIAL_SYNC_KEY
        sync: false # MESMO valor do secret homônimo no GitHub Actions (seção 5.1)
      - key: AUTOMATION_API_KEY
        sync: false # gerada com openssl rand -hex 24; guardada em ~/.claude/millead-api-key na máquina do Rick
      - key: AUTOMATION_ORGANIZATION_ID
        sync: false # id da organização MilWeb (ver packages/database/prisma/seed.ts)
      - key: OWNER_EMAIL
        sync: false # sem ela, /api/v1/admin/social responde 404 pra todo mundo
      # Opcionais (IA, contratos, e-mail, WhatsApp) -- adicionar quando for usar:
      # ANTHROPIC_API_KEY, SIGNATURE_PROVIDER, ZAPSIGN_*, CONTRACTOR_*, SMTP_*, WHATSAPP_*
